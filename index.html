<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chikwanda Chisha</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="mediaqueries.css"/>
    <link rel="icon" href="./pictures/c_logo.png" type="image/png">

    <style>
      .welcome-screen {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: #ffffff;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 9999;
          opacity: 1;
          transition: opacity 0.5s ease-out;
      }

      .welcome-text {
        font-size: 10vw; /* Responsive font size */
        color: #333;
        display: flex;
        flex-wrap: wrap; /* Allow wrapping on smaller screens */
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 1rem;
      }

      .welcome-word {
        opacity: 0;
        transform: translateY(20px);
        margin: 0 0.5rem; /* Add space between words */
      }

      @keyframes popUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .hidden {
        opacity: 0;
        pointer-events: none;
    }

    /* Media queries for font size adjustments */
    @media (min-width: 768px) {
        .welcome-text {
            font-size: 6vw;
        }
    }

    @media (min-width: 1024px) {
        .welcome-text {
            font-size: 4vw;
        }
    }
</style>
</head>
<body>

    <div class="welcome-screen hidden">
      <h1 class="welcome-text">
          <span class="welcome-word">WELCOME</span>
          <span class="welcome-word">TO</span>
          <span class="welcome-word">MY</span>
          <span class="welcome-word">SITE!</span>
      </h1>
    </div>
    <div class="main-content">
    <nav id="desktop-nav">
        <div>
            <ul class="nav-links">
                <li><a href="tech.html">Tech Portfolio</a></li>
                <li><a href="finance.html">Finance Portfolio</a></li>
            </ul>
        </div>
    </nav>
    <nav id="hamburger-nav">
        <div class="logo">Chikwanda Chisha</div>
        <div class="hamburger-menu">
            <div class="hamburger-icon" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="menu-links">
                <li><a href="tech.html" onclick="toggleMenu()">Tech Portfolio</a></li>
                <li><a href="finance.html" onclick="toggleMenu()">Finance Portfolio</a></li>
            </div>
        </div>
    </nav>
    <section id="profile">
      <div class="profile-container">
          <div class="section__pic-container">
              <img src="./pictures/DP.png" alt="Chikwanda Profile Picture">
          </div>
          <div class="section__text">
              <p class="section__text__p1">Hello, I am</p>
              <h1 class="title" id="animated-name"></h1>
              <p class="section__text__p2">A junior at Dartmouth College</p>
              <div class="btn-container">
                  <button class="btn btn-color-2" onclick="location.href='tech.html'">
                      Tech Portfolio
                  </button>
                  <button class="btn btn-color-1" onclick="location.href='finance.html'">
                      Finance Portfolio
                  </button>
              </div>
              <div id="socials-container">
                  <img src="./pictures/linkedin.png" alt="My LinkedIn Profile" class="icon" onclick="window.open('http://www.linkedin.com/in/chikwanda-chisha')">
                  <img src="./pictures/github.png" alt="My Github Profile" class="icon" onclick="window.open('https://github.com/ChikwandaChisha')">
              </div>
          </div>
      </div>
    </section>

    <section id="contact">
      <p class="section__text__p1">Get in Touch</p>
      <h1 class="title">Contact Me</h1>
      <div class="contact-info-upper-container">
        <div class="contact-info-container">
          <img
            src="./pictures/email.png"
            alt="Email icon"
            class="icon contact-icon email-icon"
          />
          <p><a href="mailto:hello.chikwanda@gmail.com">Email</a></p>
        </div>
        <div class="contact-info-container">
          <img
            src="./pictures/linkedin.png"
            alt="LinkedIn icon"
            class="icon contact-icon"
          />
          <p><a href="https://www.linkedin.com/in/chikwanda-chisha" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>
        </div>
      </div>
    </section>
    <footer>
      <nav>
          <div class="nav-links-container">
              <ul class="nav-links">
                  <li><a href="tech.html">Tech Portfolio</a></li>
                  <li><a href="finance.html">Finance Portfolio</a></li>
              </ul>
          </div>
      </nav>
    </footer>
    </div>
  <script src="script.js"></script>
</body>
</html>
